name: Build and deploy site

# Builds public/ from src/ (JSON is the single source of truth) and deploys it to GitHub Pages. public/ is also
# committed (for preview and history, like webcam-test) but the deploy never depends on it: it always rebuilds fresh.
# One-time setup: repo Settings -> Pages -> Build and deployment -> Source = "GitHub Actions".

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'utilities/silo_linking/**'
      - 'package.json'
      - 'package-lock.json'
      # silo-rotation.yml's monthly commit only touches public/*.html (never src/); without this a manual push of
      # regenerated pages would not redeploy. The job rebuilds from src/ regardless, so it just reproduces the
      # same rotation.
      - 'public/**'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:
    inputs:
      date:
        description: 'Silo rotation month to build (YYYY-MM). Leave empty to use today. Set by silo-rotation.yml.'
        required: false
        default: ''

permissions:
  contents: read
  pages: write
  id-token: write

# Only one deploy at a time; let an in-flight run finish rather than canceling it mid-publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # schema.py reads git history for datePublished/dateModified

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Validate JSON and render site
        run: python3 src/generate.py

      - name: Patch this month's silo links into public/
        env:
          ROTATION_DATE: ${{ github.event.inputs.date }}
        run: |
          DATE_ARG=""
          if [ -n "$ROTATION_DATE" ]; then DATE_ARG="--date=$ROTATION_DATE"; fi
          python3 utilities/silo_linking/generate_silo_rotation.py $DATE_ARG

      - uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
