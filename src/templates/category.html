{{INCLUDE:_head.html}}
{{INCLUDE:_header.html}}

{{INCLUDE:_sidebar.html}}

    <main id="{{PAGE_ID}}-main-content" class="@container min-w-0 flex-1 space-y-10 pb-16 pt-3 focus:outline-none" tabindex="-1" data-page-main="{{PAGE_ID}}">
      {{AD_TOP}}

      <div id="{{PAGE_ID}}-intro-area" class="space-y-4">
      {{BREADCRUMB}}

        <section id="{{PAGE_ID}}-hero-section" aria-labelledby="{{PAGE_ID}}-hero-heading" data-section="hero">
          <div id="{{PAGE_ID}}-hero-layout">
            <div id="{{PAGE_ID}}-hero-text-column" class="min-w-0">
              <div id="{{PAGE_ID}}-hero-title-row" class="flex items-start gap-4">
                {{HERO_TILE}}
                <h1 id="{{PAGE_ID}}-hero-heading" class="font-display text-3xl font-bold leading-[1.1] tracking-tight sm:text-4xl">{{H1}}</h1>
              </div>
              <p id="{{PAGE_ID}}-hero-intro" class="mt-4 text-[17px] leading-relaxed text-ink-muted">{{SUBTITLE}}</p>

              <nav id="{{PAGE_ID}}-jump-navigation" class="mt-6" aria-labelledby="{{PAGE_ID}}-jump-navigation-heading">
                <h2 id="{{PAGE_ID}}-jump-navigation-heading" class="text-sm font-bold text-ink-muted">Jump to a sub category</h2>
                <ul id="{{PAGE_ID}}-jump-link-list" class="mt-2.5 flex flex-wrap gap-2" role="list">
{{JUMP_LINKS}}
                </ul>
              </nav>
            </div>

          </div>
        </section>
      </div>

      <section id="{{PAGE_ID}}-sub-category-directory-section" class="space-y-8 border-t border-line pt-8" aria-label="Financial calculators by topic" data-section="sub-category-directory">
        
        {{DIRECTORY}}
      </section>

      {{CONTENT_SECTIONS}}

      {{FAQ}}

      {{AUTHOR_BOX}}

            

      {{AD_BOTTOM}}
    </main>

{{INCLUDE:_footer.html}}
</body>
</html>
