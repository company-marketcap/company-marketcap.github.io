<!doctype html>
<html lang="en" id="{{PAGE_ID}}-document" data-page-slug="{{PAGE_ID}}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{META_TITLE}}</title>
  <meta name="description" content="{{META_DESCRIPTION}}">
  <link rel="canonical" href="{{CANONICAL_URL}}">
  <meta name="robots" content="{{ROBOTS}}">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#F1F4F0" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#121714" media="(prefers-color-scheme: dark)">
  <link rel="icon" type="image/png" sizes="96x96" href="/assets/images/favicon-96x96.png">

  <meta property="og:type" content="website">
  <meta property="og:site_name" content="{{SITE_NAME}}">
  <meta property="og:title" content="{{META_TITLE}}">
  <meta property="og:description" content="{{META_DESCRIPTION}}">
  <meta property="og:url" content="{{CANONICAL_URL}}">
  <meta name="twitter:card" content="summary">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible+Mono:wght@400;600&family=Atkinson+Hyperlegible+Next:ital,wght@0,400;0,600;0,700;1,400&family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&display=swap">

  <link rel="preload" href="/assets/css/site-theme-and-components.css" as="fetch" crossorigin>
  <script src="/assets/js/site-head-styles-and-theme-loader.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <script src="/assets/js/site-theme-navigation-and-search.js" defer></script>
  {{HEAD_EXTRA}}
  {{JSON_LD}}
</head>
