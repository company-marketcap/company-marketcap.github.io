<body id="{{PAGE_ID}}-page-body" class="min-h-dvh bg-page font-body text-ink antialiased" data-page-slug="{{PAGE_ID}}" data-page-type="{{PAGE_TYPE}}">
  <a id="{{PAGE_ID}}-skip-link" href="#{{PAGE_ID}}-main-content" class="skip-link">Skip to main content</a>

  <header id="{{PAGE_ID}}-site-header" data-mobile-search="closed" class="sticky top-0 z-40 border-b border-line bg-page/95 backdrop-blur-sm" data-region="site-header">
    <div id="{{PAGE_ID}}-site-header-inner" class="mx-auto flex h-16 max-w-[1600px] items-center gap-3 px-4 lg:px-6">
      <button id="{{PAGE_ID}}-sidebar-open-button" type="button" class="icon-button lg:hidden" data-mobile-search-hide aria-controls="{{PAGE_ID}}-sidebar" aria-expanded="false" data-sidebar-control="open">
        <svg class="size-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true" focusable="false"><path d="M4 7h16M4 12h16M4 17h10"/></svg>
        <span class="sr-only">Open calculator categories</span>
      </button>

      <a id="{{PAGE_ID}}-site-logo-link" href="/" class="focus-ring flex min-w-0 items-center gap-2.5 rounded-lg md:w-52 md:shrink-0" data-mobile-search-hide aria-label="{{SITE_NAME}} home">
        <svg id="{{PAGE_ID}}-header-brand-mark" class="size-9 shrink-0" viewBox="0 0 96 96" aria-hidden="true" focusable="false">
            <rect width="96" height="96" rx="22" fill="#2F5233"/>
            <g stroke="#D4E8C8" stroke-width="7" stroke-linecap="round" fill="none">
              <path d="M19 30h22M30 19v22"/>
              <path d="M55 30h22"/>
              <path d="M22.5 58.5l15 15M37.5 58.5l-15 15"/>
            </g>
            <path d="M55 61h22M55 71h22" stroke="#F7ECB5" stroke-width="7" stroke-linecap="round"/>
          </svg>
        <span id="{{PAGE_ID}}-site-logo-text" class="truncate font-display text-lg font-bold tracking-tight">{{SITE_NAME}}</span>
      </a>

      <div id="{{PAGE_ID}}-header-search-wrapper" class="hidden flex-1 justify-start md:flex">
        <search id="{{PAGE_ID}}-header-search" class="block w-full max-w-md" data-search-region="header">
            <form id="{{PAGE_ID}}-header-search-form" class="relative" action="/" method="get" data-search-key="header" data-search-prefill="true">
              <label for="{{PAGE_ID}}-header-search-input" class="sr-only">Search calculators</label>
              <svg class="pointer-events-none absolute left-3.5 top-3 size-5 text-ink-muted" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true" focusable="false"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
              <input id="{{PAGE_ID}}-header-search-input" name="q" type="search" autocomplete="off" spellcheck="false" enterkeyhint="search" placeholder="Search calculators, e.g. mortgage" class="search-input" aria-describedby="{{PAGE_ID}}-header-search-status" aria-controls="{{PAGE_ID}}-header-search-results" data-search-input="header">
              <p id="{{PAGE_ID}}-header-search-status" class="sr-only" aria-live="polite"></p>
              <ul id="{{PAGE_ID}}-header-search-results" class="search-results" aria-label="Matching calculators" hidden></ul>
            </form>
          </search>
      </div>

      <div id="{{PAGE_ID}}-mobile-search-inline" class="hidden min-w-0 flex-1 items-center gap-2" data-mobile-search-inline>
        <button id="{{PAGE_ID}}-mobile-search-close-button" type="button" class="icon-button" data-mobile-search-close>
          <svg class="size-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
          <span class="sr-only">Close search</span>
        </button>
        <search id="{{PAGE_ID}}-mobile-search" class="block min-w-0 flex-1" data-search-region="mobile">
          <form id="{{PAGE_ID}}-mobile-search-form" class="relative" action="/" method="get" data-search-key="mobile">
            <label for="{{PAGE_ID}}-mobile-search-input" class="sr-only">Search calculators</label>
            <svg class="pointer-events-none absolute left-3.5 top-3 size-5 text-ink-muted" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true" focusable="false"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
            <input id="{{PAGE_ID}}-mobile-search-input" name="q" type="search" autocomplete="off" spellcheck="false" enterkeyhint="search" placeholder="Search calculators" class="search-input" aria-describedby="{{PAGE_ID}}-mobile-search-status" aria-controls="{{PAGE_ID}}-mobile-search-results" data-search-input="mobile">
            <p id="{{PAGE_ID}}-mobile-search-status" class="sr-only" aria-live="polite"></p>
            <ul id="{{PAGE_ID}}-mobile-search-results" class="search-results" aria-label="Matching calculators" hidden></ul>
          </form>
        </search>
      </div>

      <nav id="{{PAGE_ID}}-header-navigation" class="{{HEADER_NAV_CLASSES}}" data-mobile-search-hide aria-label="Main">
        <ul class="flex items-center gap-1" role="list">
          <li><a id="{{PAGE_ID}}-header-link-home" class="header-nav-link" href="/">Home</a></li>
          <li><a id="{{PAGE_ID}}-header-link-all-calculators" class="header-nav-link" href="/financial-calculators.html">All calculators</a></li>
          <li><a id="{{PAGE_ID}}-header-link-about" class="header-nav-link" href="/about.html">About</a></li>
          <li><a id="{{PAGE_ID}}-header-link-contact" class="header-nav-link" href="/contact.html">Contact</a></li>
        </ul>
      </nav>

      <button id="{{PAGE_ID}}-mobile-search-open-button" type="button" class="icon-button ml-auto md:hidden" data-mobile-search-hide data-mobile-search-open aria-controls="{{PAGE_ID}}-mobile-search-inline" aria-expanded="false">
        <svg class="size-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true" focusable="false"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <span class="sr-only">Search calculators</span>
      </button>

      <button id="{{PAGE_ID}}-theme-toggle-button" type="button" class="icon-button" data-mobile-search-hide data-theme-state="system" aria-label="Theme: System. Switch to light theme">
        <svg data-theme-icon="system" class="size-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><rect x="3" y="4" width="18" height="12" rx="2"/><path d="M8 20h8M12 16v4"/></svg>
        <svg data-theme-icon="light" class="size-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true" focusable="false" hidden><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        <svg data-theme-icon="dark" class="size-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false" hidden><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5Z"/></svg>
        <span id="{{PAGE_ID}}-theme-toggle-label" class="hidden sm:inline">System</span>
      </button>
    </div>
  </header>
